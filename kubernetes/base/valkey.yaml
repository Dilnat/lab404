apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: valkey
spec:
  encryptedData:
    password: 
  template:
    metadata:
      name: valkey
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/part-of: lab404
      annotations:
        sealedsecrets.bitnami.com/managed: "true"
    type: Opaque
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/component: data
    app.kubernetes.io/part-of: lab404
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/component: data
        app.kubernetes.io/part-of: lab404
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        lab404.io/workload: stateful
      tolerations:
        - key: workload
          operator: Equal
          value: stateful
          effect: NoSchedule
      containers:
        - name: valkey
          image: valkey/valkey:8.1-alpine
          imagePullPolicy: IfNotPresent
          command: ["valkey-server"]
          args: ["--requirepass", "$(VALKEY_PASSWORD)"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey
                  key: password
          ports:
            - name: valkey
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/part-of: lab404
spec:
  selector:
    app.kubernetes.io/name: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
