worker_processes 1;
error_log /dev/stderr info;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
  access_log /dev/stdout;
  client_body_temp_path /tmp/client-body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

    map $http_x_input $mapped_value {
        default "nomatch";
        ~^(?<capture>.+)$ "matched";
    }

    server {
        listen 8080;

        location ~ "^/test/(.+)$" {
            add_header X-Debug "$1--$mapped_value--$1" always;
            return 200 "capture=[$1] mapped=[$mapped_value]\n";
        }

        location = /health {
            return 200 "ok\n";
        }

        location / {
            return 200 "Lab 404 nginx\n";
        }
    }
}
