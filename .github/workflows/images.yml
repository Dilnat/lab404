name: Build images

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  HADOLINT_IMAGE: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
  DOCKLE_IMAGE: goodwithtech/dockle:v0.4.15@sha256:eade932f793742de0aa8755406c7677cd7696f8675b6180926f7eeffa7abe6b9

jobs:
  lint:
    name: Lint ${{ matrix.service }} Dockerfile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [web, votes]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run Hadolint
        run: docker run --rm -i "${HADOLINT_IMAGE}" hadolint - < "apps/${{ matrix.service }}/Dockerfile"

  build:
    name: Build ${{ matrix.service }} for ${{ matrix.target.arch }}
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [web, votes]
        target:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hardened Images
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        name: Set image name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/lab404-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - id: build
        name: Build and push by digest
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/${{ matrix.service }}
          platforms: ${{ matrix.target.platform }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.service }}-${{ matrix.target.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  trivy:
    name: Trivy ${{ matrix.service }} for ${{ matrix.arch }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        service: [web, votes]
        arch: [amd64, arm64]

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digests-${{ matrix.service }}-${{ matrix.arch }}
          path: /tmp/digests

      - id: image
        name: Resolve platform digest
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          digest="$(ls /tmp/digests)"
          echo "ref=ghcr.io/${OWNER,,}/lab404-${{ matrix.service }}@sha256:${digest}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM and vulnerability report
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p evidence cache
          trivy() {
            docker run --rm \
              -e TRIVY_USERNAME -e TRIVY_PASSWORD \
              -v "$PWD/cache:/root/.cache" -v "$PWD/evidence:/evidence" \
              "${TRIVY_IMAGE}" "$@"
          }
          trivy image --image-src remote --format cyclonedx \
            --output /evidence/sbom.cdx.json "${IMAGE}"
          trivy image --image-src remote --skip-db-update --scanners vuln \
            --format json --output /evidence/vulnerabilities.json "${IMAGE}"
          trivy image --image-src remote --skip-db-update --scanners vuln \
            --format table "${IMAGE}" | tee evidence/vulnerabilities.txt
          echo "${IMAGE}" > evidence/image.txt

      - name: Upload Trivy evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-${{ matrix.service }}-${{ matrix.arch }}
          path: evidence/
          if-no-files-found: error

      - name: Enforce vulnerability threshold
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm \
            -e TRIVY_USERNAME -e TRIVY_PASSWORD \
            -v "$PWD/cache:/root/.cache" \
            "${TRIVY_IMAGE}" image --image-src remote --skip-db-update \
            --scanners vuln --severity CRITICAL --ignore-unfixed \
            --exit-code 1 "${IMAGE}"

  dockle:
    name: Dockle ${{ matrix.service }} for ${{ matrix.arch }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        service: [web, votes]
        arch: [amd64, arm64]

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digests-${{ matrix.service }}-${{ matrix.arch }}
          path: /tmp/digests

      - id: image
        name: Resolve platform digest
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          digest="$(ls /tmp/digests)"
          echo "ref=ghcr.io/${OWNER,,}/lab404-${{ matrix.service }}@sha256:${digest}" >> "$GITHUB_OUTPUT"

      - name: Run Dockle
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          DOCKLE_USERNAME: ${{ github.actor }}
          DOCKLE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p evidence
          dockle() {
            docker run --rm \
              -e DOCKLE_USERNAME -e DOCKLE_PASSWORD \
              -v "$PWD/evidence:/evidence" \
              "${DOCKLE_IMAGE}" --accept-key=--access-logfile "$@"
          }
          dockle --format json --output /evidence/dockle.json "${IMAGE}"
          dockle --exit-code 1 --exit-level warn "${IMAGE}"

      - name: Upload Dockle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dockle-${{ matrix.service }}-${{ matrix.arch }}
          path: evidence/
          if-no-files-found: error

  publish:
    name: Publish ${{ matrix.service }} index
    needs: [trivy, dockle]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [web, votes]

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-${{ matrix.service }}-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        name: Set image name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/lab404-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - id: index
        name: Create multi-platform index
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          tag="${IMAGE}:sha-${GITHUB_SHA}"
          if docker buildx imagetools inspect "${tag}" >/dev/null 2>&1; then
            echo "::error::${tag} already exists; commit tags are immutable."
            exit 1
          fi
          refs=()
          for digest in *; do
            refs+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create --tag "${tag}" "${refs[@]}"
          digest="$(docker buildx imagetools inspect "${tag}" --format '{{ .Manifest.Digest }}')"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "ref=${IMAGE}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Verify index platforms
        env:
          REF: ${{ steps.index.outputs.ref }}
        run: |
          platforms="$(docker buildx imagetools inspect --raw "${REF}" |
            jq -r '[.manifests[].platform
              | select(.os != "unknown")
              | "\(.os)/\(.architecture)"] | sort | join(" ")')"
          echo "Platforms: ${platforms}"
          test "${platforms}" = "linux/amd64 linux/arm64"

      - name: Record index
        env:
          TAG: ${{ steps.index.outputs.tag }}
          REF: ${{ steps.index.outputs.ref }}
        run: |
          mkdir -p evidence
          docker buildx imagetools inspect "${REF}" | tee evidence/index.txt
          echo "${REF}" > evidence/index-ref.txt
          echo "${TAG}" > evidence/index-tag.txt

      - name: Upload index evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: index-${{ matrix.service }}
          path: evidence/
          if-no-files-found: error

  sign:
    name: Sign ${{ matrix.service }} index
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: read
      packages: write
      id-token: write
    strategy:
      matrix:
        service: [web, votes]

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: index-${{ matrix.service }}
          path: index

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: index
        name: Resolve published index digest
        run: echo "ref=$(cat index/index-ref.txt)" >> "$GITHUB_OUTPUT"

  promote:
    name: Promote ${{ matrix.service }} to latest
    if: github.ref == 'refs/heads/main'
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        service: [web, votes]

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: index-${{ matrix.service }}
          path: index

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move latest
        run: |
          ref="$(cat index/index-ref.txt)"
          image="${ref%@*}"
          docker buildx imagetools create --tag "${image}:latest" "${ref}"
          promoted="$(docker buildx imagetools inspect "${image}:latest" --format '{{ .Manifest.Digest }}')"
          test "${promoted}" = "${ref#*@}"

  evidence:
    name: Upload image evidence
    needs: [publish, sign]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: evidence

      - name: Summarize evidence
        working-directory: evidence
        run: |
          {
            echo "## Image evidence"
            echo
            echo "| Service | Commit tag | Index digest |"
            echo "| --- | --- | --- |"
            for service in web votes; do
              echo "| ${service} | \`$(cat "index-${service}/index-tag.txt")\` | \`$(cat "index-${service}/index-ref.txt")\` |"
            done
            echo
            echo "| Scan | Image |"
            echo "| --- | --- |"
            for dir in trivy-*; do
              echo "| ${dir} | \`$(cat "${dir}/image.txt")\` |"
            done
          } | tee summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload consolidated evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-evidence-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90
